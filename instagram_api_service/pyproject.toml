[project]
name = "instagram-service"
version = "0.1.0"
description = "Standalone Instagram Graph API service scaffold extracted from Electro Analyzer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"
